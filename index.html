<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCAuthentication.html</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font to the body */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-800">

    <!-- Main container -->
    <!-- This div uses flexbox to center the content vertically and horizontally on all screen sizes. -->
    <div class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">

        <!-- Content container -->
        <!-- We add a max-width here to constrain the image size on larger screens (tablets and desktops) -->
        <!-- 'w-full' makes it responsive on mobile, 'sm:max-w-xl' caps the width on screens larger than 'sm'. -->
        <div class="w-full sm:max-w-xl">
            <!-- The anchor tag has been removed, so the image is no longer a clickable link. -->
            <img src="https://images2.imgbox.com/47/12/I7jWm0cL_o.jpg" 
                 alt="image host"
                 class="rounded-lg shadow-lg w-full h-auto">
        </div>
        
    </div>

</body>
</html>
